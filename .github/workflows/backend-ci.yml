name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run mypy
        run: python -m mypy src tests

      - name: Run tests
        run: python -m pytest

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: runwright-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend container
        run: |
          docker run --detach \
            --name runwright-api-test \
            --publish 8000:8000 \
            runwright-api:test

      - name: Verify health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi

            sleep 2
          done

          echo "Runwright API did not become healthy."
          docker logs runwright-api-test
          exit 1

      - name: Verify non-root runtime user
        run: |
          docker exec runwright-api-test \
            sh -c 'test "$(id -u)" -ne 0'

      - name: Show container logs
        if: always()
        run: docker logs runwright-api-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force runwright-api-test || true